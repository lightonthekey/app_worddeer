<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>单词配对 · v2 原型（巩固台）</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%;
    background: #EFEDF6;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    display: flex; align-items: center; justify-content: center;
  }

  /* ---------- 手机框 ---------- */
  .phone {
    position: relative;
    width: 390px; height: 844px;
    background: #FBFAFE;
    border-radius: 30px;
    overflow: hidden;
    display: flex; flex-direction: column;
    box-shadow: 0 18px 50px rgba(60, 52, 137, .18);
  }
  @media (max-width: 420px) {
    html, body { display: block; background: #FBFAFE; }
    .phone { width: 100%; height: 100vh; height: 100dvh; border-radius: 0; box-shadow: none; }
  }

  /* ---------- 顶部 ---------- */
  .hud {
    flex: none;
    padding: 14px 18px 0;
    display: flex; align-items: flex-start; gap: 12px;
  }
  .xbtn {
    flex: none; width: 34px; height: 34px; border-radius: 50%;
    border: 1px solid #E6E3F0; background: #fff; color: #6F6A85;
    font-size: 15px; line-height: 1; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    padding: 0;
  }
  .xbtn:active { background: #F2F0F8; }
  .title-wrap { flex: 1; min-width: 0; padding-top: 1px; }
  .title { font-size: 16px; font-weight: 700; color: #2A1F4A; letter-spacing: .2px; }
  .subtitle { font-size: 11.5px; color: #8F8AA6; margin-top: 2px; }
  .timer {
    flex: none; font-size: 11.5px; color: #6F6A85;
    border: 1px solid #E6E3F0; background: #fff;
    border-radius: 11px; padding: 5px 10px;
    font-variant-numeric: tabular-nums;
  }

  /* ---------- 进度 ---------- */
  .progwrap { flex: none; padding: 11px 18px 0; display: flex; align-items: center; gap: 9px; }
  .progbar { flex: 1; height: 6px; border-radius: 4px; background: #E7E3F4; overflow: hidden; }
  .progbar > i {
    display: block; height: 100%; width: 0%; border-radius: 4px;
    background: linear-gradient(90deg, #6F63E8, #8E7CF0);
    transition: width .35s cubic-bezier(.25,.8,.3,1);
  }
  .progtext { font-size: 11.5px; font-weight: 600; color: #5A50E0; font-variant-numeric: tabular-nums; }

  /* ---------- 巩固台 ---------- */
  .shelfwrap { flex: none; padding: 12px 18px 0; }
  .shelflabel {
    font-size: 10.5px; color: #A09BB4; letter-spacing: .3px;
    margin-bottom: 5px; display: flex; justify-content: space-between;
  }
  .shelf {
    height: 78px; padding: 6px; border-radius: 13px; background: #F3F1F9;
    overflow: hidden; position: relative;
  }
  /* 轨道：三个槽位并排，超出部分被 .shelf 裁掉。
     满 3 个时整体向左平移一格 —— 老词滑出左边，新词从右边滑进来，
     比原来「三个格子同时换字」柔和得多。 */
  .track {
    display: flex; flex-wrap: nowrap; gap: 6px; height: 100%;
    will-change: transform;
  }
  .slot {
    position: relative; border-radius: 9px;
    flex: 0 0 calc((100% - 12px) / 3);
    border: 1px dashed #DCD7EC; background: transparent;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    overflow: hidden;
    transition: background .25s ease, border-color .25s ease, box-shadow .25s ease;
  }
  .slot .en { font-size: 12.5px; font-weight: 700; color: #2A1F4A; line-height: 1.15;
              max-width: 100%; padding: 0 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .slot .zh { font-size: 11px; color: #86809C; margin-top: 2px; line-height: 1.15;
              max-width: 100%; padding: 0 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .slot.filled { border-style: solid; border-color: #E4DFF3; background: #fff; }
  /* 刚落位的词对：放大字号 + 绿框高亮，停 2 秒 */
  .slot.fresh {
    background: #EAF9EF; border-color: #58CC02; box-shadow: 0 3px 12px rgba(88,204,2,.18);
  }
  .slot.fresh .en { font-size: 15px; color: #237A00; }
  .slot.fresh .zh { font-size: 12.5px; color: #3E8F76; }
  .slot.pop { animation: slotPop .42s cubic-bezier(.34,1.56,.64,1); }
  @keyframes slotPop {
    0% { transform: scale(.72); } 55% { transform: scale(1.1); } 100% { transform: scale(1); }
  }
  .slot .badge {
    position: absolute; top: 3px; right: 4px;
    font-size: 9px; color: #58CC02; opacity: 0; transition: opacity .25s ease;
  }
  .slot.fresh .badge { opacity: 1; }

  /* ---------- 棋盘 ---------- */
  .board {
    flex: 1; min-height: 0;
    padding: 12px 18px 4px;
    display: grid; grid-template-columns: 1fr 1fr;
    grid-template-rows: repeat(4, 124px);
    gap: 10px;
    align-content: center;
  }
  .cell {
    position: relative;
    border-radius: 15px; background: #fff;
    border: 1.5px solid #E8E5F2;
    box-shadow: 0 2px 3px rgba(70,60,190,.06);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 3px; padding: 6px 9px;
    cursor: pointer; user-select: none;
    transition: transform .14s ease, background .16s ease, border-color .16s ease,
                box-shadow .16s ease, opacity .2s ease;
    overflow: hidden;
  }
  .cell .main {
    font-size: 19px; font-weight: 600; color: #2A1F4A; line-height: 1.15;
    max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .cell .sub {
    font-size: 11.5px; color: #A09BB4; line-height: 1.15;
    max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .cell:active { transform: scale(.985); }
  .cell.sel {
    background: #EFEBFF; border-color: #6F63E8;
    box-shadow: 0 5px 14px rgba(111,99,232,.22);
    transform: translateY(-2px);
  }
  .cell.sel .main { color: #3E33B8; }
  .cell.sel .sub { color: #6E63C8; }
  .cell.ok { background: #E8F8EE; border-color: #58CC02; box-shadow: 0 4px 14px rgba(88,204,2,.2); }
  .cell.ok .main { color: #237A00; }
  .cell.ok .sub { color: #3E8F76; }
  .cell.hop { animation: hop .3s ease; }
  @keyframes hop {
    0% { transform: translateY(0) scale(1); }
    38% { transform: translateY(-9px) scale(1.035); }
    70% { transform: translateY(-2px) scale(1.012); }
    100% { transform: translateY(-3.5px) scale(1.015); }
  }
  .cell.bad { background: #FFEBEB; border-color: #FF4B4B; }
  .cell.bad .main { color: #C0392B; }
  .cell.bad .sub { color: #D0726A; }
  .cell.shake { animation: shake .42s ease; }
  @keyframes shake {
    0%,100% { transform: translateX(0); } 18% { transform: translateX(-5px); }
    38% { transform: translateX(5px); } 58% { transform: translateX(-4px); }
    78% { transform: translateX(3px); }
  }
  .cell.blank {
    background: transparent; border: 1.5px dashed #DEDAF0; box-shadow: none; cursor: default;
  }
  .cell.blank .main, .cell.blank .sub { opacity: 0; }
  .cell.enter { animation: enter .34s cubic-bezier(.34,1.4,.64,1); }
  @keyframes enter {
    0% { transform: scale(.86) translateY(6px); opacity: 0; }
    100% { transform: scale(1) translateY(0); opacity: 1; }
  }

  /* ---------- 底部提示 ---------- */
  .foot {
    flex: none; height: 46px; padding: 0 18px;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 600; color: #8F8AA6;
    transition: color .18s ease;
  }
  .foot.ok { color: #2E8B00; }
  .foot.bad { color: #C0392B; }

  /* ---------- 连击飘字 ---------- */
  .cheer {
    position: absolute; left: 50%; top: 23.5%;
    transform: translate(-50%, -50%);
    font-size: 27px; font-weight: 800; color: #3DB000;
    text-shadow: 0 1px 0 #fff, 0 -1px 0 #fff, 1px 0 0 #fff, -1px 0 0 #fff,
                 0 3px 12px rgba(0,0,0,.10);
    pointer-events: none; opacity: 0; z-index: 6; white-space: nowrap;
  }
  .cheer.show { animation: cheerUp 1.6s ease forwards; }
  .cheer.big { font-size: 36px; color: #E08F00;
               text-shadow: 0 1px 0 #fff, 0 -1px 0 #fff, 1px 0 0 #fff, -1px 0 0 #fff,
                            0 0 18px rgba(255,179,0,.5), 0 3px 12px rgba(0,0,0,.18); }
  @keyframes cheerUp {
    0%   { transform: translate(-50%, -20%) scale(.5); opacity: 0; }
    16%  { transform: translate(-50%, -50%) scale(1.24); opacity: 1; }
    52%  { transform: translate(-50%, -56%) scale(1.1); opacity: 1; }
    100% { transform: translate(-50%, -125%) scale(1.02); opacity: 0; }
  }

  /* ---------- 飞行中的克隆卡 ---------- */
  .flyer {
    position: absolute; z-index: 8; pointer-events: none;
    border-radius: 15px; background: #E8F8EE; border: 1.5px solid #58CC02;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 3px; padding: 6px 9px; overflow: hidden;
    box-shadow: 0 8px 22px rgba(88,204,2,.24);
  }
  .flyer .main { font-size: 17px; font-weight: 600; color: #237A00; line-height: 1.15;
                 max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .flyer .sub { font-size: 11px; color: #3E8F76; line-height: 1.15;
                max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  #fx { position: absolute; inset: 0; pointer-events: none; z-index: 20; }

  /* ---------- 结算 ---------- */
  .over {
    position: absolute; inset: 0; z-index: 30; display: none;
    background: rgba(28, 22, 56, .42);
    align-items: center; justify-content: center;
    backdrop-filter: blur(2px);
  }
  .over.show { display: flex; animation: fadeIn .25s ease; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .card {
    width: 300px; background: #fff; border-radius: 22px; padding: 22px 20px 18px;
    text-align: center; animation: cardIn .34s cubic-bezier(.34,1.4,.64,1);
  }
  @keyframes cardIn { from { transform: scale(.9) translateY(10px); opacity: 0; }
                      to { transform: scale(1) translateY(0); opacity: 1; } }
  .card h2 { margin: 0 0 2px; font-size: 20px; font-weight: 800; color: #2A1F4A; }
  .card .sm { font-size: 12px; color: #8F8AA6; margin-bottom: 16px; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; margin-bottom: 16px; }
  .st { background: #F4F3FA; border-radius: 11px; padding: 10px 4px; }
  .st b { display: block; font-size: 19px; color: #2A1F4A; font-variant-numeric: tabular-nums; }
  .st span { font-size: 10.5px; color: #8F8AA6; }
  .again {
    width: 100%; padding: 13px; border: 0; border-radius: 13px;
    background: #5A50E0; color: #fff; font-size: 15px; font-weight: 700; cursor: pointer;
    font-family: inherit;
  }
  .again:active { background: #4A41C4; }
</style>
</head>
<body>

<div class="phone" id="phone">
  <div class="hud">
    <button class="xbtn" id="xbtn" title="退出">✕</button>
    <div class="title-wrap">
      <div class="title" id="gTitle">U3 学习关</div>
      <div class="subtitle" id="gSub">A1 · 12 对配对</div>
    </div>
    <div class="timer" id="gTimer">0:00</div>
  </div>

  <div class="progwrap">
    <div class="progbar"><i id="gProg"></i></div>
    <div class="progtext" id="gCount">0 / 12</div>
  </div>

  <div class="shelfwrap">
    <div class="shelflabel">
      <span>刚配对</span>
      <span id="shelfHint">配对成功的词会停在这里</span>
    </div>
    <div class="shelf" id="shelf">
      <div class="track" id="track">
        <div class="slot" data-slot="0"></div>
        <div class="slot" data-slot="1"></div>
        <div class="slot" data-slot="2"></div>
      </div>
    </div>
  </div>

  <div class="board" id="board"></div>

  <div class="foot" id="foot">先点左边英文，再点右边对应的中文</div>

  <div class="cheer" id="cheer"></div>
  <canvas id="fx"></canvas>

  <div class="over" id="over">
    <div class="card">
      <h2 id="ovTitle">本关完成</h2>
      <div class="sm" id="ovSub">12 对全部配对</div>
      <div class="stats">
        <div class="st"><b id="ovMatched">0</b><span>配对</span></div>
        <div class="st"><b id="ovAcc">0%</b><span>一次选对</span></div>
        <div class="st"><b id="ovCombo">0</b><span>最高连击</span></div>
      </div>
      <button class="again" id="ovAgain">再来一关</button>
    </div>
  </div>
</div>

<script>
(() => {
  'use strict';

  // ---------------------------------------------------------------- 词库
  const WORDS = [
    { en: 'milk',      ph: '[mɪlk]',        zh: '牛奶',   pos: 'n.' },
    { en: 'sleep',     ph: '[sliːp]',       zh: '睡觉',   pos: 'v.' },
    { en: 'water',     ph: '[ˈwɔːtər]',     zh: '水',     pos: 'n.' },
    { en: 'hello',     ph: '[həˈloʊ]',      zh: '你好',   pos: 'interj.' },
    { en: 'cat',       ph: '[kæt]',         zh: '猫',     pos: 'n.' },
    { en: 'book',      ph: '[bʊk]',         zh: '书',     pos: 'n.' },
    { en: 'run',       ph: '[rʌn]',         zh: '跑',     pos: 'v.' },
    { en: 'happy',     ph: '[ˈhæpi]',       zh: '快乐的', pos: 'adj.' },
    { en: 'friend',    ph: '[frend]',       zh: '朋友',   pos: 'n.' },
    { en: 'school',    ph: '[skuːl]',       zh: '学校',   pos: 'n.' },
    { en: 'eat',       ph: '[iːt]',         zh: '吃',     pos: 'v.' },
    { en: 'beautiful', ph: '[ˈbjuːtɪfl]',   zh: '美丽的', pos: 'adj.' }
  ];

  const ROWS = 4;               // 棋盘行数
  const SHELF_MAX = 3;          // 巩固台槽位数

  // 时序（毫秒）—— 与需求文档一致
  const T = {
    judge:    140,   // 判定缓冲
    flyStart: 480,   // 绿卡开始起飞
    flyDur:   340,   // 飞行时长
    fresh:    2000,  // 巩固台高亮停留
    wrong:    520    // 配错恢复
  };

  // ---------------------------------------------------------------- 状态
  const $ = s => document.querySelector(s);
  const rnd = () => Math.random();
  const boardEl = $('#board');
  const shelfEl = $('#shelf');
  const trackEl = $('#track');
  const phoneEl = $('#phone');

  let en = [], zh = [], queue = [], cells = [];
  let sel = null;              // {side, i}
  let lock = false;
  let matched = 0, combo = 0, bestCombo = 0, firstTry = 0, attempts = 0;
  let wrongSet = new Set();
  let shelfItems = [];         // [{en, zh}]
  let over = false, t0 = 0, timer = null;
  const total = WORDS.length;

  // ---------------------------------------------------------------- 音效
  let actx = null;
  const soundOn = (() => { try { return localStorage.getItem('v2_sound') !== '0'; } catch (e) { return true; } })();
  function ensureAudio() {
    try {
      if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === 'suspended') actx.resume();
    } catch (e) { actx = null; }
  }
  function beep(freq, dur, vol, delay, type) {
    if (!soundOn || !actx) return;
    try {
      const o = actx.createOscillator(), g = actx.createGain();
      const t = actx.currentTime + (delay || 0);
      o.type = type || 'sine';
      o.frequency.value = freq;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(vol || .055, t + .012);
      g.gain.exponentialRampToValueAtTime(.0001, t + dur);
      o.connect(g); g.connect(actx.destination);
      o.start(t); o.stop(t + dur + .02);
    } catch (e) {}
  }
  const playOk = () => { beep(660, .12, .05); beep(880, .13, .05, .11); };
  const playBad = () => { beep(300, .11, .06, 0, 'sawtooth'); beep(180, .16, .06, .1, 'sawtooth'); };
  const playMilestone = () => [523, 659, 784, 1046].forEach((f, i) => beep(f, .15, .055, i * .1));
  const isBig = s => [5, 10, 15, 20, 25, 30, 40, 50].includes(s) || (s >= 50 && s % 25 === 0);

  // ---------------------------------------------------------------- 纸屑
  const cvs = $('#fx');
  const cctx = cvs.getContext('2d');
  let cfRunning = false, pieces = [];
  const CF_COLORS = ['#58CC02', '#FFD700', '#FF6B6B', '#5B8DEF', '#C586E0', '#FF9F43'];

  function sizeCvs() {
    const r = phoneEl.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    cvs.width = Math.round(r.width * dpr);
    cvs.height = Math.round(r.height * dpr);
    cvs.style.width = r.width + 'px';
    cvs.style.height = r.height + 'px';
    cctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cvs._w = r.width; cvs._h = r.height;
  }

  function fire(n, ox, oy, speed) {
    const W = cvs._w || 390, H = cvs._h || 844;
    for (let i = 0; i < n; i++) {
      const burst = typeof ox === 'number' && typeof oy === 'number';
      let x, y, vx, vy;
      if (burst) {
        x = ox + (rnd() - .5) * 14;
        y = oy + (rnd() - .5) * 14;
        const ang = rnd() * Math.PI * 2;
        const sp = (1.6 + rnd() * 3.6) * (speed || 1);
        vx = Math.cos(ang) * sp;
        vy = Math.sin(ang) * sp - 1.3;
      } else {
        x = rnd() * W; y = -20 - rnd() * 60;
        vx = (rnd() - .5) * 1.6; vy = 2 + rnd() * 2.2;
      }
      pieces.push({
        x, y, w: 6 + rnd() * 7, h: 9 + rnd() * 9,
        rot: rnd() * Math.PI * 2, vr: (rnd() - .5) * .3,
        vx, vy, color: CF_COLORS[i % CF_COLORS.length], life: 0
      });
    }
    if (!cfRunning) { cfRunning = true; requestAnimationFrame(cfStep); }
  }

  function cfStep() {
    const W = cvs._w || 390, H = cvs._h || 844;
    cctx.clearRect(0, 0, W, H);
    pieces = pieces.filter(p => p.life < 240);
    for (const p of pieces) {
      p.life++;
      p.vy += .07;
      p.x += p.vx + Math.sin(p.life * .05) * .5;
      p.y += p.vy;
      p.rot += p.vr;
      cctx.save();
      cctx.translate(p.x, p.y);
      cctx.rotate(p.rot);
      cctx.globalAlpha = Math.max(0, 1 - p.life / 240);
      cctx.fillStyle = p.color;
      cctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      cctx.restore();
    }
    if (pieces.length) requestAnimationFrame(cfStep);
    else { cfRunning = false; cctx.clearRect(0, 0, W, H); }
  }

  // ---------------------------------------------------------------- 工具
  function shuffle(a) {
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(rnd() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }
  function localCenter(el) {
    const r = el.getBoundingClientRect();
    const p = phoneEl.getBoundingClientRect();
    return { x: r.left - p.left + r.width / 2, y: r.top - p.top + r.height / 2, w: r.width, h: r.height };
  }

  // ---------------------------------------------------------------- 开局
  function start() {
    queue = shuffle(WORDS.slice());
    en = []; zh = [];
    for (let i = 0; i < ROWS; i++) {
      const w = queue.shift();
      en.push(w ? w : null);
      zh.push(w ? w : null);
    }
    // 两列各自打乱；避免同一行左右正好是同一个词（白送）
    en = shuffle(en.filter(Boolean));
    let zs = shuffle(zh.filter(Boolean));
    for (let i = 0; i < Math.min(en.length, zs.length); i++) {
      if (en[i] && zs[i] && en[i].en === zs[i].en) {
        for (let j = 0; j < zs.length; j++) {
          if (j === i) continue;
          if (zs[j].en === en[i].en) continue;
          if (en[j] && en[j].en === zs[i].en) continue;
          [zs[i], zs[j]] = [zs[j], zs[i]];
          break;
        }
      }
    }
    zh = zs;

    matched = 0; combo = 0; bestCombo = 0; firstTry = 0; attempts = 0;
    wrongSet.clear(); shelfItems = []; sel = null; lock = false; over = false;
    pieces = [];
    cctx.clearRect(0, 0, cvs._w || 390, cvs._h || 844);

    renderBoard(true);
    boardEl.style.opacity = '1';
    renderShelf();
    setFoot('先点左边英文，再点右边对应的中文', '');
    $('#over').classList.remove('show');
    updateHud();

    t0 = Date.now();
    clearInterval(timer);
    timer = setInterval(tick, 250);
  }

  function tick() {
    if (over) return;
    const s = Math.floor((Date.now() - t0) / 1000);
    $('#gTimer').textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  }

  // ---------------------------------------------------------------- 渲染棋盘
  function renderBoard(initial) {
    boardEl.innerHTML = '';
    cells = [];
    const mk = (side, i) => {
      const el = document.createElement('div');
      el.className = 'cell' + (initial ? ' enter' : '');
      el.dataset.side = side;
      el.dataset.i = i;
      el.addEventListener('click', () => onTap(side, i));
      boardEl.appendChild(el);
      cells.push({ side, i, el });
      return el;
    };
    for (let i = 0; i < ROWS; i++) {
      const e = mk('en', i);
      paint(e, en[i], true);
      const z = mk('zh', i);
      paint(z, zh[i], false);
    }
  }

  function paint(el, w, isEn) {
    if (!w) {
      el.classList.add('blank');
      el.innerHTML = '';
      return;
    }
    el.classList.remove('blank');
    el.innerHTML =
      '<div class="main">' + esc(isEn ? w.en : w.zh) + '</div>' +
      '<div class="sub">' + esc(isEn ? w.ph : w.pos) + '</div>';
  }

  function esc(s) {
    return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  }

  function cellEl(side, i) {
    const c = cells.find(x => x.side === side && x.i === i);
    return c ? c.el : null;
  }

  // 找某一格的可见文字用的可访问标号，便于自动化测试
  function wordAt(side, i) { return side === 'en' ? en[i] : zh[i]; }

  // ---------------------------------------------------------------- 交互
  function onTap(side, i) {
    if (lock || over) return;
    const w = wordAt(side, i);
    if (!w) return;
    const el = cellEl(side, i);
    if (el.classList.contains('gone')) return;

    if (sel && sel.side === side && sel.i === i) {          // 再点一次取消
      el.classList.remove('sel');
      sel = null;
      return;
    }
    if (sel && sel.side === side) {                          // 同侧改选
      const prev = cellEl(side, sel.i);
      if (prev) prev.classList.remove('sel');
      sel = { side, i };
      el.classList.add('sel');
      return;
    }
    if (!sel) {
      sel = { side, i };
      el.classList.add('sel');
      setFoot(side === 'en' ? '已选 ' + w.en + '，请点右侧对应中文' : '已选中文，请点左侧对应的英文', '');
      return;
    }

    // 异侧 → 判定
    const a = sel;
    const ai = a.i, zi = i;
    const aEl = cellEl(a.side, ai), bEl = el;
    sel = null;
    attempts++;
    judge(a.side === 'en' ? ai : zi, a.side === 'en' ? zi : ai,
          a.side === 'en' ? aEl : bEl, a.side === 'en' ? bEl : aEl);
  }

  function judge(ei, zi, enEl, zhEl) {
    lock = true;
    const ew = en[ei], zw = zh[zi];
    const ok = ew && zw && ew.en === zw.en;

    enEl.classList.remove('sel'); zhEl.classList.remove('sel');

    setTimeout(() => {
      if (over) return;
      if (ok) onMatch(ei, zi, enEl, zhEl);
      else onMiss(ei, zi, enEl, zhEl);
    }, T.judge);
  }

  // 配对成功
  function onMatch(ei, zi, enEl, zhEl) {
    const w = en[ei];
    matched++; combo++;
    bestCombo = Math.max(bestCombo, combo);
    if (!wrongSet.has(w.en)) firstTry++;
    updateHud();

    enEl.classList.add('ok', 'hop');
    zhEl.classList.add('ok', 'hop');
    setFoot('✓ ' + w.en + ' = ' + w.zh, 'ok');

    const big = isBig(combo);
    if (combo >= 2) showCheer(combo >= 2 ? '连对 ' + combo + '！' : '', big);
    if (big) { playMilestone(); } else { playOk(); }

    // 纸屑：从两张卡的**连线中点**炸一簇（参考页的做法）。
    // 不在两张卡各自中心炸 —— 那样纸屑正好盖住刚配对上的词，
    // 把用户最该看的那一眼挡住了。
    const pa = localCenter(enEl), pb = localCenter(zhEl);
    fire(big ? 34 : 14, (pa.x + pb.x) / 2, (pa.y + pb.y) / 2, 2.2);

    // 关键：判定完立刻解锁，绿卡停留期间用户就能点下一组
    lock = false;

    setTimeout(() => flyToShelf(ei, zi, enEl, zhEl, w), T.flyStart);
  }

  // 绿卡飞向巩固台
  function flyToShelf(ei, zi, enEl, zhEl, w) {
    if (over) return;

    // 目标槽位 = 这个词最终停留的位置。
    // 台子没满：落在第一个空格；满了：落在最右那格（左移之后它就停在这儿）。
    const full = shelfItems.length >= SHELF_MAX;
    const targetIdx = full ? SHELF_MAX - 1 : shelfItems.length;
    const slotEl = trackEl.children[targetIdx];
    const dst = slotEl ? localCenter(slotEl) : localCenter(shelfEl);

    // 两张卡各自做成飞行克隆，一起飞向目标槽位（视觉上就是「合拢」）
    [enEl, zhEl].forEach((srcEl) => {
      const p = localCenter(srcEl);
      const f = document.createElement('div');
      f.className = 'flyer';
      f.style.left = (p.x - p.w / 2) + 'px';
      f.style.top = (p.y - p.h / 2) + 'px';
      f.style.width = p.w + 'px';
      f.style.height = p.h + 'px';
      f.innerHTML = '<div class="main">' + esc(srcEl.querySelector('.main')?.textContent || '') + '</div>';
      phoneEl.appendChild(f);
      requestAnimationFrame(() => {
        f.style.transition = 'transform ' + T.flyDur + 'ms cubic-bezier(.3,.7,.4,1), opacity ' + T.flyDur + 'ms ease';
        f.style.transform = 'translate(' + (dst.x - p.x) + 'px,' + (dst.y - p.y) + 'px) scale(.5)';
        f.style.opacity = '0';
      });
      setTimeout(() => f.remove(), T.flyDur + 60);
    });

    // 原卡立即隐藏并补位
    enEl.classList.add('gone');
    zhEl.classList.add('gone');
    enEl.style.opacity = '0';
    zhEl.style.opacity = '0';

    setTimeout(() => {
      // 补新词（原地：哪格消失补哪格）
      refill(ei, zi);
    }, 120);

    // 落位
    setTimeout(() => {
      if (over) return;
      enqueueShelf({ en: w.en, zh: w.zh, fresh: true });
      beep(1046, .1, .04);
    }, T.flyDur);
  }

  // ---------------------------------------------------------------- 巩固台落位
  //
  // 老实现：满 3 个就整块重绘 —— 三格文字同时换成另外三个词，画面「闪」一下，
  // 眼睛还得重新读一遍。改成轨道左移：老词从左边滑出去，新词从右边滑进来，
  // 其余两个只是平移、文字不变，读起来是「一条流水在往前推」。
  const SHIFT_MS = 300;
  let shelfQueue = [];
  let shelfBusy = false;

  function enqueueShelf(item) {
    shelfQueue.push(item);
    pumpShelf();
  }

  /// 一次只处理一个落位：左移动画没走完时不插入下一张，
  /// 否则第二张会在第一张还在平移时算错位置。
  function pumpShelf() {
    if (shelfBusy) return;
    const item = shelfQueue.shift();
    if (!item) return;
    shelfBusy = true;
    landOnShelf(item, () => { shelfBusy = false; pumpShelf(); });
  }

  function landOnShelf(item, done) {
    if (over) { done(); return; }

    // ---- 还有空格：直接落进去
    if (shelfItems.length < SHELF_MAX) {
      const idx = shelfItems.length;
      shelfItems.push(item);
      const el = trackEl.children[idx];
      paintSlot(el, item);
      el.classList.add('pop');
      setTimeout(() => el.classList.remove('pop'), 440);
      updateShelfHint();
      setTimeout(() => { el.classList.remove('fresh'); item.fresh = false; }, T.fresh);
      done();
      return;
    }

    // ---- 满了：整条左移一格
    shelfItems.shift();
    shelfItems.push(item);

    const gap = 6;
    const step = trackEl.children[0].getBoundingClientRect().width + gap;

    // 新词先作为第 4 格挂到轨道尾部（此时它在右边界外，被 .shelf 裁掉）
    const el = document.createElement('div');
    el.className = 'slot';
    paintSlot(el, item);
    trackEl.appendChild(el);
    updateShelfHint();

    // 用「强制回流」起动画，不用 requestAnimationFrame。
    // rAF 在后台标签页或虚拟时间下可能被推迟到 300ms 收尾之后执行 ——
    // 那时轨道已经删卡归位，又被设回终点，就永久卡在左边了。
    trackEl.style.transition = 'none';
    trackEl.style.transform = 'translateX(0)';
    void trackEl.offsetWidth;                 // 提交这一帧，让起点被浏览器记住
    trackEl.style.transition = 'transform ' + SHIFT_MS + 'ms cubic-bezier(.25,.8,.3,1)';
    trackEl.style.transform = 'translateX(' + (-step) + 'px)';

    setTimeout(() => {
      // 动画收尾：把已经滑出左边的那张真正删掉，轨道瞬间归位（不播过渡）
      trackEl.style.transition = 'none';
      trackEl.style.transform = 'translateX(0)';
      const first = trackEl.firstElementChild;
      if (first && first !== el) first.remove();
      void trackEl.offsetWidth;          // 强制吃掉这一帧，否则下次左移会从旧位置跳一下
      trackEl.style.transition = '';
      setTimeout(() => { el.classList.remove('fresh'); item.fresh = false; }, T.fresh - SHIFT_MS);
      done();
    }, SHIFT_MS);
  }

  // 补位规则：英文列固定当锚点，中文列整列重排
  //
  // 为什么不是整盘重排：8 张卡全换位置，眼睛要重新扫一遍，学习时最忌讳。
  // 为什么中文要重排：只换一格的话，位置固定下来，用户闭眼点同一行就能连对。
  // 英文固定 + 中文洗牌，正好兼顾「位置稳定」和「不能蒙」。
  function refill(ei, zi) {
    const w = queue.shift();

    // ---- 队列空了 = 收尾：这一对直接清掉，剩下的卡片收拢到底部对齐
    if (!w) {
      en[ei] = null;
      zh[zi] = null;
      compact();
      checkEnd();
      return;
    }

    // ---- 英文列：哪格消失就补哪格，位置永远不动
    en[ei] = w;
    const e = cellEl('en', ei);
    paint(e, w, true);
    e.classList.remove('gone', 'ok', 'hop', 'bad', 'sel');
    e.style.opacity = '1';
    e.classList.add('enter');
    setTimeout(() => e.classList.remove('enter'), 360);

    // ---- 中文列：新词先塞进刚空出来的格子，然后整列洗一遍
    zh[zi] = w;
    reshuffleZh();

    checkEnd();
  }

  /// 收尾收拢：把剩余卡片往前挤，空位统一留在底部。
  ///
  /// 不做这一步的话，左右两列会各剩几个虚线空格、位置还错开
  /// （左列空第 1 行、右列空第 2 行），看上去像界面出错了。
  function compact() {
    if (sel) {
      const p = cellEl(sel.side, sel.i);
      if (p) p.classList.remove('sel');
      sel = null;
    }

    const eItems = en.filter(Boolean);
    const zItems = zh.filter(Boolean);
    // 中文重排到「没有一行左右同词」
    for (let t = 0; t < 30 && zItems.length > 1; t++) {
      shuffle(zItems);
      let bad = false;
      for (let k = 0; k < eItems.length; k++) {
        if (eItems[k] && zItems[k] && eItems[k].en === zItems[k].en) { bad = true; break; }
      }
      if (!bad) break;
    }
    en = eItems.concat(Array(ROWS - eItems.length).fill(null));
    zh = zItems.concat(Array(ROWS - zItems.length).fill(null));

    for (let i = 0; i < ROWS; i++) {
      for (const side of ['en', 'zh']) {
        const el = cellEl(side, i);
        const w = side === 'en' ? en[i] : zh[i];
        paint(el, w, side === 'en');
        el.classList.remove('gone', 'ok', 'hop', 'bad', 'sel', 'enter');
        el.style.opacity = '1';
      }
    }
  }

  /// 中文列整列重排：位置全打乱，且保证没有任何一行左右是同一个词。
  function reshuffleZh() {
    // 用户可能刚好在这 120ms 里又点了张中文卡，重排会把他的选中搞错位，直接清掉
    if (sel && sel.side === 'zh') {
      const p = cellEl('zh', sel.i);
      if (p) p.classList.remove('sel');
      sel = null;
    }

    const idxs = [], items = [];
    for (let i = 0; i < ROWS; i++) {
      if (zh[i]) { idxs.push(i); items.push(zh[i]); }
    }
    if (items.length < 2) return;

    // 打乱到「没有一行左右同词」为止；4 个元素最多几十次必然能出解
    for (let t = 0; t < 30; t++) {
      shuffle(items);
      let bad = false;
      for (let k = 0; k < idxs.length; k++) {
        if (en[idxs[k]] && en[idxs[k]].en === items[k].en) { bad = true; break; }
      }
      if (!bad) break;
    }
    for (let k = 0; k < idxs.length; k++) zh[idxs[k]] = items[k];

    for (const i of idxs) {
      const el = cellEl('zh', i);
      paint(el, zh[i], false);
      el.classList.remove('gone', 'ok', 'hop', 'bad', 'sel');
      el.style.opacity = '1';
      el.classList.add('enter');
      setTimeout(() => el.classList.remove('enter'), 360);
    }
  }

  // 配错
  function onMiss(ei, zi, enEl, zhEl) {
    combo = 0;
    const ew = en[ei], zw = zh[zi];
    if (ew) wrongSet.add(ew.en);
    if (zw) wrongSet.add(zw.en);
    playBad();

    enEl.classList.add('bad', 'shake');
    zhEl.classList.add('bad', 'shake');
    setFoot('配错了 · 再想想这两个词各自的意思', 'bad');

    setTimeout(() => {
      enEl.classList.remove('bad', 'shake');
      zhEl.classList.remove('bad', 'shake');
      lock = false;
      setFoot('再试一次', '');
    }, T.wrong);
  }

  // ---------------------------------------------------------------- 巩固台
  function paintSlot(el, it) {
    el.className = 'slot filled' + (it && it.fresh ? ' fresh' : '');
    el.innerHTML = it
      ? '<div class="en">' + esc(it.en) + '</div>' +
        '<div class="zh">' + esc(it.zh) + '</div>' +
        '<div class="badge">✓</div>'
      : '';
  }

  function updateShelfHint() {
    const n = shelfItems.filter(Boolean).length;
    $('#shelfHint').textContent = n
      ? '最近 ' + n + ' 个'
      : '配对成功的词会停在这里';
  }

  /// 全量重建（开局 / 重开）。平时落位走 landOnShelf，不调这个。
  function renderShelf() {
    shelfQueue = [];
    shelfBusy = false;
    trackEl.style.transition = 'none';
    trackEl.style.transform = 'translateX(0)';
    trackEl.innerHTML = '';
    for (let k = 0; k < SHELF_MAX; k++) {
      const el = document.createElement('div');
      el.className = 'slot';
      el.dataset.slot = k;
      trackEl.appendChild(el);
    }
    shelfItems.forEach((it, k) => { if (it) paintSlot(trackEl.children[k], it); });
    void trackEl.offsetWidth;
    trackEl.style.transition = '';
    updateShelfHint();
  }

  // ---------------------------------------------------------------- 提示
  function setFoot(t, kind) {
    const f = $('#foot');
    f.textContent = t;
    f.className = 'foot' + (kind ? ' ' + kind : '');
  }

  const CHEERS = ['太棒了！', '漂亮！', '不错哦！', '继续！', '稳！', '连击！'];
  let cheerTimer = null;
  function showCheer(text, big) {
    const c = $('#cheer');
    c.textContent = big ? (text || '完美！') : (text || CHEERS[Math.floor(rnd() * CHEERS.length)]);
    c.className = 'cheer' + (big ? ' big' : '');
    void c.offsetWidth;
    c.classList.add('show');
    clearTimeout(cheerTimer);
    cheerTimer = setTimeout(() => c.classList.remove('show'), 1900);
  }

  // ---------------------------------------------------------------- HUD
  function updateHud() {
    $('#gCount').textContent = matched + ' / ' + total;
    $('#gProg').style.width = Math.min(100, matched / total * 100) + '%';
  }

  // ---------------------------------------------------------------- 结算
  function checkEnd() {
    const empty = en.every(x => !x) && zh.every(x => !x);
    if (!empty || queue.length) return;
    setTimeout(() => { if (!over) finish(); }, 500);
  }

  function finish() {
    over = true;
    clearInterval(timer);
    // 棋盘这时候已经全空，只剩一屏虚线格子，露在弹窗后面很脏 —— 整块淡下去
    boardEl.style.transition = 'opacity .45s ease';
    boardEl.style.opacity = '.18';
    const acc = attempts ? Math.round(firstTry / attempts * 100) : 100;
    $('#ovMatched').textContent = matched;
    $('#ovAcc').textContent = acc + '%';
    $('#ovCombo').textContent = bestCombo;
    $('#ovSub').textContent = acc >= 100 ? '一次全对，整关满星' : total + ' 对全部配对';
    $('#over').classList.add('show');
    for (let i = 0; i < 3; i++) {
      setTimeout(() => fire(30, 60 + i * 130, 120, 1.4), i * 110);
    }
    playMilestone();
  }

  // ---------------------------------------------------------------- 绑定
  sizeCvs();
  window.addEventListener('resize', sizeCvs);
  $('#ovAgain').addEventListener('click', () => start());
  $('#xbtn').addEventListener('click', () => {
    if (lock) return;
    start();
  });

  document.addEventListener('pointerdown', ensureAudio, { once: true });

  start();

  // 自动化演示：打开 #auto 自动连打，方便截图与回归
  if (/auto/.test(location.hash)) {
    setTimeout(function step() {
      if (over) return;
      // 找一对能配上的
      let ei = -1, zi = -1;
      for (let i = 0; i < ROWS && ei < 0; i++) {
        if (!en[i]) continue;
        for (let j = 0; j < ROWS; j++) {
          if (zh[j] && zh[j].en === en[i].en) { ei = i; zi = j; break; }
        }
      }
      if (ei >= 0 && zi >= 0) {
        onTap('en', ei);
        onTap('zh', zi);
      }
      setTimeout(step, 700);
    }, 900);
  }
})();
</script>
</body>
</html>
