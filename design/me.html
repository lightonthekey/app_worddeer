<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#F7F9FF">
<title>我的 · 用户中心</title>
<style>
:root{
  --primary:#4B6FF0; --primary-deep:#3A5AD8; --primary-50:#EEF3FF;
  --bg:#F7F9FF; --ink:#1C2231; --muted:#7C87A3; --line:#E4EAF8;
  --dash:#CCD8FB; --amber:#E0A02A; --flame:#E8674A;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--edge,#E3E8F3);color:var(--ink);
  display:grid;place-items:center;overflow:hidden;transition:background .25s;
}
#app{
  position:relative;width:390px;height:844px;background:var(--bg);
  display:flex;flex-direction:column;overflow:hidden;border-radius:26px;
  box-shadow:0 24px 60px -20px rgba(24,34,64,.45);transition:background .25s;
}
.sb{height:26px;flex:none;display:flex;align-items:center;justify-content:space-between;
    padding:0 22px;font-size:11px;font-weight:600;color:var(--n3,#333C50)}
.sb-r{letter-spacing:.4px;opacity:.7}

.scroll{flex:1;overflow-y:auto;padding:6px 16px 16px;scrollbar-width:none}
.scroll::-webkit-scrollbar{width:0}

/* ---------- 顶部账号 ---------- */
.who{display:flex;align-items:center;gap:12px;padding:6px 2px 14px}
.ava{width:52px;height:52px;border-radius:50%;flex:none;display:grid;place-items:center;
  font-size:26px;background:var(--primary-50);border:1px solid var(--line)}
.who .nm{font-size:16px;font-weight:800;letter-spacing:-.2px}
.who .sub{font-size:11.5px;color:var(--muted);margin-top:3px}
.sync{margin-left:auto;font-family:inherit;font-size:11.5px;font-weight:700;color:var(--primary);
  background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 12px;cursor:pointer}
.sync:active{background:var(--primary-50)}

/* ---------- 三宫格 ---------- */
.stats{display:flex;gap:9px;margin-bottom:14px}
.stats div{flex:1;background:#fff;border:1px solid var(--line);border-radius:15px;
  padding:11px 10px 10px;text-align:center}
.stats b{display:block;font-size:19px;font-weight:800;letter-spacing:-.4px;color:var(--primary-deep);
  font-variant-numeric:tabular-nums}
.stats span{display:block;font-size:10.5px;color:var(--muted);margin-top:2px}

/* ---------- 卡片 ---------- */
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px 15px;
  margin-bottom:13px;box-shadow:0 10px 24px -22px rgba(24,34,64,.6)}
.card-head{display:flex;align-items:baseline;gap:8px;margin-bottom:11px}
.card-head b{font-size:13.5px;font-weight:800}
.card-head small{font-size:10.5px;color:var(--muted)}
.card-head .now{margin-left:auto;font-size:10.5px;font-weight:700;color:var(--primary);
  background:var(--primary-50);border-radius:999px;padding:3px 9px}

/* ---------- 主题选择器（由 wb-theme.js 渲染） ---------- */
.wb-themes{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.wb-theme{position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;
  font-family:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;
  border-radius:14px;padding:11px 4px 9px;transition:border-color .18s,background .18s,transform .12s}
.wb-theme:active{transform:scale(.97)}
.wb-theme .wb-dot{width:24px;height:24px;border-radius:50%;margin-bottom:6px;
  background:linear-gradient(150deg,var(--c1),var(--c2));box-shadow:0 0 0 4px var(--c3)}
.wb-theme b{font-size:11.5px;font-weight:700;color:var(--ink);line-height:1.2}
.wb-theme s{font-size:9.5px;color:var(--muted);text-decoration:none;line-height:1.3}
.wb-theme.on{border-color:var(--primary);background:var(--primary-50);border-width:1.5px;
  box-shadow:0 0 0 3px rgba(var(--pri-rgb),.12)}
.wb-theme.on::after{content:'✓';position:absolute;top:6px;right:7px;width:13px;height:13px;
  border-radius:50%;background:var(--primary);color:#fff;font-size:9px;font-weight:900;
  display:grid;place-items:center}

/* ---------- 列表行 ---------- */
.row{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0;padding-bottom:2px}
.row .ic{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:14px;
  background:var(--primary-50);flex:none}
.row .k{font-size:12.5px;font-weight:600}
.row .v{margin-left:auto;font-size:11.5px;color:var(--muted);font-weight:600}
.row .v i{font-style:normal;color:var(--n3,#B7BFD2);margin-left:4px}
.row.tap{cursor:pointer}
.row.tap:active{opacity:.6}

/* ---------- 底栏 ---------- */
.bnav{flex:none;display:flex;padding:7px 6px 16px;background:#fff;
  border-top:1px solid var(--line)}
.bnav i{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-style:normal;
  font-size:9.5px;color:var(--muted);font-weight:600;cursor:pointer}
.bnav i .ico{font-size:17px;line-height:1;filter:grayscale(1);opacity:.55}
.bnav i.on{color:var(--primary)}
.bnav i.on .ico{filter:none;opacity:1}

.toast{position:absolute;left:50%;bottom:76px;transform:translate(-50%,10px);
  background:rgba(24,34,64,.9);color:#fff;font-size:11.5px;padding:8px 14px;border-radius:11px;
  opacity:0;pointer-events:none;transition:.2s;z-index:20;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>
<script src="wb-theme.js"></script>
</head>
<body>
<div id="app">
  <div class="sb"><span>9:41</span><span class="sb-r">5G ▮▮▮</span></div>

  <div class="scroll">
    <div class="who">
      <div class="ava">🦌</div>
      <div>
        <div class="nm">词汇旅人</div>
        <div class="sub">A1 入门 · 已学 68 / 452 词</div>
      </div>
      <button class="sync" id="syncBtn">云同步</button>
    </div>

    <div class="stats">
      <div><b>29</b><span>连续天数</span></div>
      <div><b>68</b><span>已学单词</span></div>
      <div><b>17</b><span>掌握主题</span></div>
    </div>

    <div class="card">
      <div class="card-head">
        <b>外观主题</b><small>换颜色不影响学习记录</small>
        <span class="now" id="nowName">靛蓝</span>
      </div>
      <div id="themeGrid"></div>
    </div>

    <div class="card">
      <div class="card-head"><b>学习设置</b></div>
      <div class="row tap"><span class="ic">🎯</span><span class="k">每日目标</span>
        <span class="v">50 词 <i>›</i></span></div>
      <div class="row tap"><span class="ic">🔊</span><span class="k">发音</span>
        <span class="v">美式 <i>›</i></span></div>
      <div class="row tap"><span class="ic">⏰</span><span class="k">学习提醒</span>
        <span class="v">20:30 <i>›</i></span></div>
    </div>

    <div class="card">
      <div class="card-head"><b>记录与数据</b></div>
      <div class="row tap"><span class="ic">🔥</span><span class="k">打卡记录</span>
        <span class="v">29 天 <i>›</i></span></div>
      <div class="row tap"><span class="ic">☁️</span><span class="k">云端备份</span>
        <span class="v">上次 2 小时前 <i>›</i></span></div>
      <div class="row tap"><span class="ic">🧩</span><span class="k">关于词鹿</span>
        <span class="v">v1.0.0 <i>›</i></span></div>
    </div>
  </div>

  <nav class="bnav">
    <i onclick="location.href='home-v3-terrace.html'"><span class="ico">🔥</span>学习</i>
    <i onclick="toast('复习页还没做原型')"><span class="ico">↻</span>复习</i>
    <i onclick="toast('词典页还没做原型')"><span class="ico">🔍</span>词典</i>
    <i class="on"><span class="ico">👤</span>我的</i>
  </nav>

  <div class="toast" id="toast"></div>
</div>

<script>
  const nowName = document.getElementById('nowName');
  WB.mount(document.getElementById('themeGrid'), {
    onPick: function (key) {
      const t = WB.themes.find(x => x.key === key);
      nowName.textContent = t.name;
      toast('已换成「' + t.name + '」');
    }
  });
  nowName.textContent = WB.themes.find(x => x.key === WB.current()).name;

  let tid;
  function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('on');
    clearTimeout(tid);
    tid = setTimeout(() => el.classList.remove('on'), 1400);
  }
  document.getElementById('syncBtn').addEventListener('click', () => toast('登录后可云端同步'));
</script>
</body>
</html>
