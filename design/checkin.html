<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>连胜 · 打卡记录</title>
<style>
:root{
  --ink:#1C2231; --muted:#7C87A3; --line:#EAF0FA; --bg:#FFFFFF;
  --red:#E01E5A; --red-deep:#C4123F; --orange:#FF6B3D; --gold:#FFC53D;
  --primary:#3E63E8; --primary-50:#EDF1FE;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background:#E3E8F3;color:var(--ink);
  display:grid;place-items:center;overflow:hidden;
}
#app{
  position:relative;width:390px;height:844px;background:var(--bg);
  display:flex;flex-direction:column;overflow:hidden;border-radius:26px;
  box-shadow:0 24px 60px -20px rgba(24,34,64,.45);
}
.sb{height:26px;flex:none;display:flex;align-items:center;justify-content:space-between;
    padding:0 22px;font-size:11px;font-weight:600;color:#333C50}
.sb-r{letter-spacing:.4px;opacity:.7}

/* ---------- 顶栏 ---------- */
.bar{flex:none;height:46px;display:flex;align-items:center;justify-content:space-between;padding:0 18px}
.bar a{
  display:grid;place-items:center;text-decoration:none;color:#525C74;
  width:34px;height:34px;border-radius:50%;font-size:17px;font-weight:300;
}
.bar a:active{background:#F4F6FD}

.scroll{flex:1;overflow-y:auto;padding:0 18px 4px}
.scroll::-webkit-scrollbar{width:0}

/* ---------- 英雄区 ---------- */
.hero{position:relative;padding:2px 2px 0;min-height:132px}
.badge{
  display:inline-flex;align-items:center;gap:4px;
  background:linear-gradient(100deg,#FFE9A8,#FFD465);
  color:#8A5B00;font-size:10.5px;font-weight:800;letter-spacing:.2px;
  padding:4px 9px;border-radius:6px;margin-bottom:10px;
}
.hero .num{
  font-size:56px;line-height:.92;font-weight:900;letter-spacing:-3px;
  background:linear-gradient(160deg,#F5335F,#E01E5A 55%,#C4123F);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.hero .unit{display:block;margin-top:6px;font-size:21px;font-weight:900;letter-spacing:-.4px;color:#E01E5A}
.flame{position:absolute;right:4px;top:12px;width:112px;height:124px}
.flame svg{width:100%;height:100%;filter:drop-shadow(0 12px 18px rgba(224,30,90,.28))}
.flame::after{
  content:"";position:absolute;left:8px;bottom:-6px;width:96px;height:18px;border-radius:50%;
  background:radial-gradient(50% 50% at 50% 50%,rgba(224,30,90,.18),rgba(224,30,90,0));
}

/* ---------- 本周提示 ---------- */
.note{
  margin-top:12px;display:flex;gap:11px;align-items:flex-start;
  border:1px solid var(--line);border-radius:16px;padding:12px 14px;background:#fff;
}
.note i{font-style:normal;font-size:19px;line-height:1;flex:none;margin-top:1px}
.note p{margin:0;font-size:12.5px;line-height:1.72;color:#444E64}
.note b{color:var(--ink)}

h3{margin:18px 0 10px;font-size:16px;font-weight:800;letter-spacing:-.2px}

/* ---------- 日历 ---------- */
.cal{border:1px solid var(--line);border-radius:18px;padding:12px 12px 10px;background:#fff}
.calhead{display:flex;align-items:center;justify-content:center;gap:20px;margin-bottom:12px}
.calhead button{
  border:0;background:none;color:#A7B0C4;font-size:17px;cursor:pointer;
  width:26px;height:26px;border-radius:50%;font-family:inherit;
}
.calhead button:active{background:#F4F6FD}
.calhead b{font-size:13px;font-weight:800;letter-spacing:.2px}

.week{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:5px}
.week span{text-align:center;font-size:10.5px;font-weight:700;color:#A7B0C4}

.days{position:relative}
.row{position:relative;height:34px}
.cell{
  position:absolute;top:0;width:14.2857%;height:34px;display:grid;place-items:center;
  font-size:12.5px;font-weight:700;color:#A7B0C4;
}
.cell.on{color:#fff}
.cell.today{font-weight:900;font-size:13.5px}
.cell.today{letter-spacing:-.3px}
.cell.faded{color:#DCD8E8}

/* 连续打卡的胶囊 */
.pill{
  position:absolute;top:2px;height:30px;border-radius:999px;
  background:linear-gradient(90deg,#C4123F,#E01E5A 40%,#FF6B3D);
  box-shadow:0 3px 8px -4px rgba(224,30,90,.55);
}
.pill.freeze{background:linear-gradient(90deg,#FFB020,#FF8A3D)}

/* ---------- 统计 ---------- */
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:14px}
.grid3 div{border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.grid3 b{display:block;font-size:19px;font-weight:900;letter-spacing:-.5px}
.grid3 small{font-size:10px;color:var(--muted);line-height:1.5}
.grid3 div:nth-child(1) b{color:#E01E5A}

.foot{
  flex:none;padding:6px 18px 18px;background:linear-gradient(#FFFFFF,rgba(255,255,255,0) 30%);
}
.rules{
  margin-top:14px;padding:10px 14px;border-radius:12px;background:#FBFCFE;
  border:1px solid var(--line);font-size:11px;line-height:1.6;color:#7C87A3;text-align:center;
}

/* 底部按钮 */
.cta{
  margin-top:0;width:100%;height:48px;border-radius:14px;border:0;cursor:pointer;
  font-family:inherit;font-size:14px;font-weight:800;color:#fff;
  background:linear-gradient(120deg,#E01E5A,#FF6B3D);
  box-shadow:0 10px 20px -10px rgba(224,30,90,.7);
}
.cta.done{
  background:#F4F6FD;color:#7C87A3;box-shadow:none;
  display:flex;align-items:center;justify-content:center;gap:6px;
}
</style>
</head>
<body>
<div id="app">
  <div class="sb"><span>9:41</span><span class="sb-r">5G ▮▮▮</span></div>

  <header class="bar">
    <a href="home-v3-terrace.html" title="关闭">✕</a>
    <a href="#" onclick="return false" title="分享">⇪</a>
  </header>

  <main class="scroll">
    <section class="hero">
      <span class="badge">🏅 连胜精英俱乐部</span>
      <div class="num">29</div>
      <span class="unit">天连胜！</span>
      <div class="flame">
        <svg viewBox="0 0 120 140" aria-hidden="true">
          <defs>
            <linearGradient id="fg" x1=".15" y1="1" x2=".85" y2="0">
              <stop offset="0" stop-color="#C4123F"/>
              <stop offset=".45" stop-color="#E01E5A"/>
              <stop offset=".78" stop-color="#FF6B3D"/>
              <stop offset="1" stop-color="#FFC53D"/>
            </linearGradient>
            <linearGradient id="fw" x1=".5" y1="1" x2=".5" y2="0">
              <stop offset="0" stop-color="#FFD9E4"/>
              <stop offset="1" stop-color="#FFFFFF"/>
            </linearGradient>
          </defs>
          <path d="M60 6c16 28 38 36 38 66a38 38 0 0 1-76 0c0-18 10-29 20-40 2 13 9 20 16 20 7 0 9-7 7-16-1-7-1-20-5-30z" fill="url(#fg)"/>
          <path d="M60 66c9 15 18 19 18 32a18 18 0 0 1-36 0c0-13 9-19 18-32z" fill="url(#fw)" opacity=".95"/>
        </svg>
      </div>
    </section>

    <div class="note">
      <i>☀️</i>
      <p>这周你已经 <b>3 次</b> 在中午前续上连胜，比上周多 1 次。</p>
    </div>

    <h3>连胜日历</h3>
    <div class="cal">
      <div class="calhead">
        <button id="prev">‹</button>
        <b id="ym">2026年11月</b>
        <button id="next">›</button>
      </div>
      <div class="week"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>
      <div class="days" id="days"></div>
    </div>

    <div class="grid3">
      <div><b>18</b><small>本月打卡</small></div>
      <div><b>29</b><small>当前连胜</small></div>
      <div><b>41</b><small>最长连胜</small></div>
    </div>

    <div class="rules">学完任意一关即算打卡 · 断一天连击归零</div>
  </main>

  <div class="foot">
    <button class="cta done" disabled>✓ 今天已打卡</button>
  </div>
</div>

<script>
/* =====================================================================
   打卡数据：'2026-11-01'..'2026-11-18' 连续打卡（和「29 天连胜」对上，
   上个月 10-19 起的部分不画，只在统计里体现）
   ===================================================================== */
const CHECKED = new Set();
for (let d = 1; d <= 18; d++) CHECKED.add(`2026-11-${String(d).padStart(2, '0')}`);
const TODAY = '2026-11-18';
// 冻结卡暂时不上色：一段里只要有一天冻结就整条变黄，反而看不出连续性

let Y = 2026, M = 11;   // 当前展示的月份

function render(){
  document.getElementById('ym').textContent = `${Y}年${M}月`;
  const first = new Date(Y, M - 1, 1);
  const daysInMonth = new Date(Y, M, 0).getDate();
  // 周一为一周第一天
  const offset = (first.getDay() + 6) % 7;

  const cells = [];  // 每格：{d, key, on, today}
  for (let i = 0; i < offset; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) {
    const key = `${Y}-${String(M).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
    cells.push({ d, key, on: CHECKED.has(key), today: key === TODAY });
  }
  while (cells.length % 7) cells.push(null);

  const rows = [];
  for (let r = 0; r < cells.length / 7; r++) rows.push(cells.slice(r * 7, r * 7 + 7));

  let html = '';
  rows.forEach(row => {
    html += '<div class="row">';
    // 连续打卡段 → 一条胶囊（按格宽 1/7 定位，断开的自动分成多条）
    let start = -1;
    const segments = [];   // 同一行里断开的连续段各自一条胶囊
    const flush = end => {
      if (start < 0) return;
      const left = start * (100 / 7);
      const width = (end - start + 1) * (100 / 7) - 1.2;
      segments.push({ left, width });
      start = -1;
    };
    row.forEach((c, i) => {
      if (c && c.on) { if (start < 0) start = i; } else flush(i - 1);
    });
    flush(6);
    segments.forEach(sg => {
      html += `<div class="pill" style="left:${sg.left}%;width:${sg.width}%"></div>`;
    });
    row.forEach((c, i) => {
      if (!c) return;
      const cls = ['cell', c.on ? 'on' : '', c.today ? 'today' : '', (!c.on ? 'faded' : '')].join(' ').trim();
      html += `<div class="${cls}" style="left:${i * (100 / 7)}%;width:${100 / 7}%">${c.d}</div>`;
    });
    html += '</div>';
  });
  document.getElementById('days').innerHTML = html;
}

document.getElementById('prev').onclick = () => { M--; if (M < 1) { M = 12; Y--; } render(); };
document.getElementById('next').onclick = () => { M++; if (M > 12) { M = 1; Y++; } render(); };
render();
</script>
</body>
</html>
