<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#F7F9FF">
<title>设置 · 词鹿</title>
<style>
:root{
  --primary:#4B6FF0; --primary-deep:#3A5AD8; --primary-50:#EEF3FF;
  --bg:#F7F9FF; --ink:#1C2231; --muted:#7C87A3; --line:#E4EAF8;
  --red:#D9534F;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--edge,#E3E8F3);color:var(--ink);
  display:grid;place-items:center;overflow:hidden;transition:background .25s;
}
#app{
  position:relative;width:390px;height:844px;background:var(--bg);
  display:flex;flex-direction:column;overflow:hidden;border-radius:26px;
  box-shadow:0 24px 60px -20px rgba(24,34,64,.45);transition:background .25s;
}
.sb{height:26px;flex:none;display:flex;align-items:center;justify-content:space-between;
    padding:0 22px;font-size:11px;font-weight:600;color:var(--n3,#333C50)}
.sb-r{letter-spacing:.4px;opacity:.7}

/* ---------- 顶栏 ---------- */
.nav{flex:none;display:flex;align-items:center;gap:6px;padding:2px 14px 12px}
.back{width:34px;height:34px;flex:none;display:grid;place-items:center;background:transparent;
  border:0;cursor:pointer;color:var(--ink);padding:0}
.back svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.2;
  stroke-linecap:round;stroke-linejoin:round}
.nav b{font-size:17px;font-weight:800;letter-spacing:-.2px}

.scroll{flex:1;overflow-y:auto;padding:2px 18px 26px;scrollbar-width:none}
.scroll::-webkit-scrollbar{width:0}

.sec{font-size:12.5px;font-weight:700;color:var(--muted);margin:16px 0 8px 2px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:13px 13px 13px 14px;
  border-bottom:1px solid var(--line);cursor:pointer;background:#fff}
.row:last-child{border-bottom:0}
.row:active{background:var(--primary-50)}
.row .ic{width:18px;height:18px;flex:none;display:grid;place-items:center;color:var(--muted)}
.row .ic svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
.row .k{font-size:13px;font-weight:600;color:var(--ink);white-space:nowrap}
.row .v{margin-left:auto;font-size:11.5px;color:var(--n3,#7C87A3);
  max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right}
.row .ch{flex:none;color:var(--n3);font-size:15px;line-height:1;opacity:.7}
.row.danger .k{color:var(--red)}
.row.danger .ic{color:var(--red)}

.sw{width:38px;height:22px;flex:none;border-radius:999px;background:var(--n2,#DCE4F4);
  position:relative;transition:background .18s;margin-left:auto}
.sw::after{content:'';position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;
  background:#fff;transition:left .18s;box-shadow:0 1px 3px rgba(24,34,64,.25)}
.sw.on{background:var(--primary)}
.sw.on::after{left:18px}

.out{width:100%;height:44px;margin-top:18px;border-radius:14px;cursor:pointer;
  border:1px solid var(--line);background:#fff;color:var(--red);
  font-family:inherit;font-size:13.5px;font-weight:700}
.out:active{background:var(--primary-50)}
.ver{text-align:center;font-size:11px;color:var(--n4,#A9B0C4);margin-top:12px}

/* ---------- 弹窗 ---------- */
.mask{position:absolute;inset:0;background:rgba(20,26,40,.42);opacity:0;pointer-events:none;
  transition:.2s;z-index:30;display:grid;place-items:center;padding:0 28px}
.mask.on{opacity:1;pointer-events:auto}
.dlg{width:100%;background:#fff;border-radius:18px;padding:18px 18px 12px;
  transform:translateY(8px);transition:.2s}
.mask.on .dlg{transform:translateY(0)}
.dlg h3{margin:0 0 8px;font-size:15px;font-weight:800}
.dlg p{margin:0 0 10px;font-size:12.5px;color:var(--muted);line-height:1.6}
.dlg input{width:100%;height:38px;border-radius:10px;border:1px solid var(--line);
  background:var(--bg);padding:0 11px;font-family:inherit;font-size:13px;color:var(--ink)}
.dlg input:focus{outline:2px solid var(--pri-line);outline-offset:-1px}
.dlg .ops{display:flex;justify-content:flex-end;gap:6px;margin-top:12px}
.dlg button{border:0;background:transparent;font-family:inherit;font-size:13px;font-weight:700;
  padding:8px 12px;border-radius:10px;cursor:pointer}
.dlg .cancel{color:var(--muted)}
.dlg .ok{color:var(--primary)}
.dlg .ok.warn{color:var(--red)}

.toast{position:absolute;left:50%;bottom:40px;transform:translate(-50%,10px);
  background:rgba(24,34,64,.9);color:#fff;font-size:11.5px;padding:8px 14px;border-radius:11px;
  opacity:0;pointer-events:none;transition:.2s;z-index:40;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>
<script src="wb-theme.js"></script>
</head>
<body>
<div id="app">
  <div class="sb"><span>9:41</span><span class="sb-r">5G ▮▮▮</span></div>

  <div class="nav">
    <button class="back" onclick="location.href='me.html?t='+WB.current()" aria-label="返回">
      <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <b>设置</b>
  </div>

  <div class="scroll">
    <div class="sec">账号</div>
    <div class="card">
      <div class="row" id="rowNick">
        <span class="ic"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="8.5" cy="11" r="2"/><path d="M13 10h5M13 14h4"/></svg></span>
        <span class="k">昵称</span>
        <span class="v" id="nickVal">词汇旅人</span>
        <span class="ch">›</span>
      </div>
      <div class="row" onclick="copyName()">
        <span class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-4 8"/></svg></span>
        <span class="k">用户名</span>
        <span class="v">@deer</span>
        <span class="ch">›</span>
      </div>
      <div class="row" onclick="toast('会员页不在本原型范围')">
        <span class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="9" r="5"/><path d="M8.5 13.5 7 21l5-2.5L17 21l-1.5-7.5"/></svg></span>
        <span class="k">会员</span>
        <span class="v">未开通</span>
        <span class="ch">›</span>
      </div>
    </div>

    <div class="sec">数据与存储</div>
    <div class="card">
      <div class="row" onclick="toast('已同步 · 刚刚')">
        <span class="ic"><svg viewBox="0 0 24 24"><path d="M17.5 18a4 4 0 0 0 .5-8 6 6 0 0 0-11.6 1.6A3.5 3.5 0 0 0 7 18z"/><path d="M12 11v5M9.8 13.8 12 11.6l2.2 2.2"/></svg></span>
        <span class="k">云端同步</span>
        <span class="v">2 分钟前</span>
        <span class="ch">›</span>
      </div>
      <div class="row danger" onclick="askClear()">
        <span class="ic"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/><path d="M10 11v5M14 11v5"/></svg></span>
        <span class="k">清除学习记录</span>
        <span class="v">不可恢复</span>
        <span class="ch">›</span>
      </div>
      <div class="row danger" onclick="askDelete()">
        <span class="ic"><svg viewBox="0 0 24 24"><circle cx="10" cy="8" r="3.5"/><path d="M4 20c.8-3.4 3.2-5 6-5s5.2 1.6 6 5"/><path d="M17 8l4 4M21 8l-4 4"/></svg></span>
        <span class="k">注销账号</span>
        <span class="v">永久删除</span>
        <span class="ch">›</span>
      </div>
    </div>

    <div class="sec">学习与反馈</div>
    <div class="card">
      <div class="row" id="rowAccent">
        <span class="ic"><svg viewBox="0 0 24 24"><path d="M5 9v6h3l5 4V5L8 9z"/><path d="M16 9a4 4 0 0 1 0 6"/></svg></span>
        <span class="k">发音</span>
        <span class="v" id="accentVal">美式</span>
        <span class="ch">›</span>
      </div>
      <div class="row" id="rowHaptic">
        <span class="ic"><svg viewBox="0 0 24 24"><rect x="7" y="4" width="10" height="16" rx="2"/><path d="M4 9v6M20 9v6"/></svg></span>
        <span class="k">答题震动</span>
        <span class="sw on" id="hapticSw"></span>
      </div>
    </div>

    <div class="sec">关于</div>
    <div class="card">
      <div class="row" onclick="showBank()">
        <span class="ic"><svg viewBox="0 0 24 24"><path d="M4 5h7v15H4zM13 5h7v15h-7z"/><path d="M4 9h7M13 9h7"/></svg></span>
        <span class="k">词库</span>
        <span class="v">A1–C1 · 452 词起</span>
        <span class="ch">›</span>
      </div>
      <div class="row" onclick="showSrs()">
        <span class="ic"><svg viewBox="0 0 24 24"><path d="M4 9h5l5-4v14l-5-4H4z"/><path d="M17 8a6 6 0 0 1 0 8"/></svg></span>
        <span class="k">记忆算法</span>
        <span class="v">间隔重复 · 7 档</span>
        <span class="ch">›</span>
      </div>

      <div class="row" onclick="toast('已是最新版本 v1.0.0')">
        <span class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.6v.1"/></svg></span>
        <span class="k">版本</span>
        <span class="v">v1.0.0</span>
        <span class="ch">›</span>
      </div>
    </div>

    <button class="out" onclick="askLogout()">退出登录</button>
    <div class="ver">词鹿英语 v1.0.0</div>
  </div>

  <!-- 通用弹窗 -->
  <div class="mask" id="mask">
    <div class="dlg" id="dlg"></div>
  </div>
  <div class="toast" id="toast"></div>
</div>

<script>
  let tid;
  function toast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('on');
    clearTimeout(tid);
    tid = setTimeout(() => el.classList.remove('on'), 1400);
  }

  /* 一个极简弹窗：title + 可选输入框 + 取消/确认 */
  function dialog({title, body, input, value, okText, warn, onOk}) {
    const mask = document.getElementById('mask');
    const dlg = document.getElementById('dlg');
    dlg.innerHTML = `
      <h3>${title}</h3>
      ${body ? `<p>${body}</p>` : ''}
      ${input ? `<input id="dlgInput" maxlength="16" value="${value || ''}" placeholder="最多 16 个字，留空用用户名">` : ''}
      <div class="ops">
        <button class="cancel" id="dlgCancel">取消</button>
        <button class="ok${warn ? ' warn' : ''}" id="dlgOk">${okText || '确定'}</button>
      </div>`;
    mask.classList.add('on');
    if (input) setTimeout(() => document.getElementById('dlgInput').focus(), 60);
    document.getElementById('dlgCancel').onclick = close;
    document.getElementById('dlgOk').onclick = () => {
      const v = input ? document.getElementById('dlgInput').value.trim() : '';
      close();
      onOk && onOk(v);
    };
    function close() { mask.classList.remove('on'); }
  }

  document.getElementById('rowNick').onclick = () => {
    const cur = localStorage.getItem('wb.nick') || '词汇旅人';
    dialog({
      title: '改昵称',
      input: true,
      value: cur,
      okText: '保存',
      onOk: (v) => {
        localStorage.setItem('wb.nick', v || 'deer');
        document.getElementById('nickVal').textContent = v || 'deer';
        toast('昵称已更新');
      }
    });
  };

  function askClear() {
    dialog({
      title: '清除学习记录？',
      body: '所有单词的掌握状态和打卡记录都会被删除，且无法恢复。',
      okText: '清空', warn: true,
      onOk: () => toast('学习记录已清空')
    });
  }

  function askDelete() {
    dialog({
      title: '注销账号？',
      body: '账号、学习进度、会员权益会被永久删除，且无法恢复。已支付的订单记录会按法规要求匿名保留。',
      okText: '永久注销', warn: true,
      onOk: () => toast('账号已注销')
    });
  }

  function askLogout() {
    dialog({
      title: '退出登录？',
      body: '学习进度仍保存在本机，下次登录可以继续同步。',
      okText: '退出', warn: true,
      onOk: () => { location.href = 'me.html?t=' + WB.current(); }
    });
  }

  // 昵称记忆
  const savedNick = localStorage.getItem('wb.nick');
  if (savedNick) document.getElementById('nickVal').textContent = savedNick;

  // ---------------------------------------------------------------- 学习与反馈

  let accent = localStorage.getItem('wb.accent') === 'uk' ? 'uk' : 'us';
  const accentVal = document.getElementById('accentVal');
  accentVal.textContent = accent === 'uk' ? '英式' : '美式';

  document.getElementById('rowAccent').onclick = () => {
    const dlg = document.getElementById('dlg');
    dlg.innerHTML = `<h3>发音</h3>
      <p>选完立刻生效，所有发音按钮都读这个设置。</p>
      <div class="ops">
        <button class="cancel" id="dlgCancel">取消</button>
        <button class="ok" id="pickUs">美式</button>
        <button class="ok" id="pickUk">英式</button>
      </div>`;
    document.getElementById(accent === 'uk' ? 'pickUk' : 'pickUs').style.fontWeight = '900';
    document.getElementById('mask').classList.add('on');
    document.getElementById('dlgCancel').onclick = closeMask;
    document.getElementById('pickUs').onclick = () => setAccent('us');
    document.getElementById('pickUk').onclick = () => setAccent('uk');
  };

  function closeMask() { document.getElementById('mask').classList.remove('on'); }

  function setAccent(v) {
    accent = v;
    localStorage.setItem('wb.accent', v);
    accentVal.textContent = v === 'uk' ? '英式' : '美式';
    closeMask();
    toast('发音已切换为' + accentVal.textContent);
  }

  let haptic = localStorage.getItem('wb.haptic') !== '0';
  const hapticSw = document.getElementById('hapticSw');
  hapticSw.classList.toggle('on', haptic);
  document.getElementById('rowHaptic').onclick = () => {
    haptic = !haptic;
    localStorage.setItem('wb.haptic', haptic ? '1' : '0');
    hapticSw.classList.toggle('on', haptic);
    toast(haptic ? '答题震动已开启' : '答题震动已关闭');
  };

  function copyName() {
    const name = '@deer';
    const done = () => toast('用户名已复制');
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(name).then(done).catch(done);
    } else {
      done();
    }
  }

  function showBank() {
    dialog({
      title: '词库',
      body: 'A1 入门 · 452 词<br>A2 基础 · 480 词<br>B1 进阶 · 620 词<br>B2 高阶 · 780 词<br>C1 精通 · 540 词<br><br>共 2872 词 · 60 个主题',
      okText: '知道了', onOk: () => {}
    });
  }

  function showSrs() {
    dialog({
      title: '记忆算法',
      body: '答对一次升一档，答错回到第一档。间隔依次是：<br>10 分钟 → 1 天 → 2 天 → 4 天 → 7 天 → 15 天 → 30 天。<br><br>升到第 5 档及以上算「已掌握」，之后每 15～30 天见一次，只为防止遗忘。',
      okText: '知道了', onOk: () => {}
    });
  }
</script>
</body>
</html>
