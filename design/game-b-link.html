<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>方案 B · 连线 — 词鹿英语配对</title>
<style>
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  :root{
    --ink:#1B1930; --ink-2:#6E6B8A; --ink-3:#A5A2BA;
    --line:#ECEAF4; --soft:#F8F7FC;
    --primary:#5A50E0; --primary-50:#EFEEFE;
    --ok:#12A06A; --bad:#E24B4A;
  }
  html,body{margin:0;height:100%}
  body{
    font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
    background:#E7E4F3; display:grid; place-items:center; padding:20px; color:var(--ink);
  }
  .frame{
    width:390px; height:844px; border-radius:44px; overflow:hidden; position:relative;
    background:#fff; box-shadow:0 26px 60px rgba(40,32,90,.28), 0 0 0 10px #15132A, 0 0 0 11px #34314F;
    display:flex; flex-direction:column;
  }

  /* ---------- 极简顶栏 ---------- */
  .top{padding:22px 24px 0; flex:none}
  .r1{display:flex; align-items:flex-start; gap:12px}
  .back{
    width:32px; height:32px; flex:none; border:none; background:none; padding:0; margin-top:-3px;
    cursor:pointer; color:var(--ink-2); display:grid; place-items:center;
  }
  .back svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .htxt{flex:1; min-width:0; padding-top:2px}
  .htxt h1{font-size:17px; font-weight:700; margin:0; letter-spacing:.2px}
  .htxt p{font-size:11px; color:var(--ink-3); margin:3px 0 0; letter-spacing:.3px}
  .clock{font-size:11.5px; color:var(--ink-3); font-variant-numeric:tabular-nums; padding-top:5px; letter-spacing:.5px}

  .barwrap{margin-top:18px; display:flex; align-items:center; gap:12px}
  .bar{flex:1; height:3px; background:#F0EEF8; border-radius:99px; overflow:hidden}
  .bar i{display:block; height:100%; width:0; background:var(--primary); border-radius:99px;
    transition:width .5s cubic-bezier(.2,.9,.2,1)}
  .cnt{font-size:11px; color:var(--ink-3); font-variant-numeric:tabular-nums; letter-spacing:.4px}
  .cnt b{color:var(--ink); font-size:12.5px}

  /* ---------- 连线区 ---------- */
  .stage{flex:1; min-height:0; position:relative; margin:16px 24px 0}
  .cols{position:absolute; left:0; right:0; top:-16px; display:grid;
    grid-template-columns:1fr 64px 1fr; font-size:9px; letter-spacing:1.6px;
    color:#C4C1D6; font-weight:700; text-transform:uppercase; pointer-events:none}
  .cols span:last-child{text-align:right}

  .board{
    position:absolute; inset:10px 0 0; display:grid;
    grid-template-columns:1fr 1fr; grid-template-rows:repeat(5,1fr);
    column-gap:64px; row-gap:10px;
  }
  .ln{position:absolute; inset:0; pointer-events:none; z-index:3; overflow:visible}

  .card{
    position:relative; min-width:0;
    display:flex; flex-direction:column; justify-content:center;
    background:var(--soft); border:none; border-radius:12px; padding:0 14px;
    cursor:pointer; text-align:left; font-family:inherit; color:inherit;
    transition:background .15s, transform .15s, opacity .28s;
  }
  .card.zh{text-align:right; align-items:flex-end}
  .card .m{font-size:16px; font-weight:640; line-height:1.15; max-width:100%;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .card .s{font-size:10.5px; color:var(--ink-3); margin-top:3px; max-width:100%;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; line-height:1.2}
  .card .s.ph{font-family:"Lucida Sans Unicode",Georgia,serif; font-size:11px; letter-spacing:.2px}
  /* 选中：左侧（中文卡为右）3px 竖条 + 淡紫底 */
  .card::before{
    content:""; position:absolute; top:12px; bottom:12px; width:3px; border-radius:3px;
    background:var(--primary); opacity:0; transition:.16s;
  }
  .card.en::before{left:0}
  .card.zh::before{right:0}
  .card.sel{background:var(--primary-50)}
  .card.sel::before{opacity:1}
  .card.sel .m{color:#3B32AE}
  .card.ok{background:#E9F8F1}
  .card.bad{background:#FCECEC; animation:shake .34s}
  .card.blank{background:transparent; border:1px dashed #EDEBF5; cursor:default; pointer-events:none}
  .card.out{opacity:0; transform:scale(.97)}
  .card.in{animation:fadein .3s ease}
  @keyframes fadein{from{opacity:0; transform:translateY(4px)}to{opacity:1; transform:none}}
  @keyframes shake{0%,100%{transform:none}22%{transform:translateX(-5px)}52%{transform:translateX(4px)}78%{transform:translateX(-2px)}}

  /* ---------- 底部 ---------- */
  .foot{flex:none; padding:14px 24px 30px; min-height:74px;
    display:flex; flex-direction:column; gap:2px; justify-content:center}
  .pick{font-size:11px; color:var(--ink-3); letter-spacing:.3px; min-height:15px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .pick em{font-style:normal; color:var(--primary); font-weight:700}
  .pick .w{color:var(--ink); font-weight:700}
  .fb{font-size:12.5px; font-weight:700; min-height:18px; transition:.18s}
  .fb.ok{color:var(--ok)}
  .fb.bad{color:var(--bad)}

  /* ---------- 结算 ---------- */
  .sheet{position:absolute; inset:0; background:#fff; z-index:9; display:none;
    flex-direction:column; padding:104px 26px 34px; text-align:center}
  .sheet.show{display:flex; animation:fadein .3s ease}
  .big{font-size:56px; line-height:1; font-weight:250; letter-spacing:-2px}
  .big small{font-size:17px; color:var(--ink-3); font-weight:400; letter-spacing:0; margin-left:4px}
  .sheet h2{font-size:16px; margin:22px 0 4px; font-weight:700}
  .sheet p{font-size:12px; color:var(--ink-2); margin:0}
  .rows{margin-top:30px; border-top:1px solid var(--line)}
  .row{display:flex; justify-content:space-between; align-items:center;
    padding:14px 2px; border-bottom:1px solid var(--line); font-size:13px}
  .row span{color:var(--ink-3); font-size:12px}
  .row b{font-variant-numeric:tabular-nums; font-weight:650}
  .wr{margin-top:18px; font-size:11.5px; color:var(--ink-3); line-height:1.6; text-align:left}
  .go{margin-top:auto; width:100%; border:none; border-radius:12px; padding:15px 0;
    background:var(--primary); color:#fff; font-size:14px; font-weight:700; font-family:inherit; cursor:pointer}
  .g2{margin-top:8px; width:100%; border:none; background:none; color:var(--ink-3);
    font-size:12px; font-family:inherit; padding:9px; cursor:pointer}

  @media (prefers-reduced-motion:reduce){ *{animation-duration:.001s !important; transition-duration:.001s !important} }
</style>
</head>
<body>
<div class="frame">
  <div class="top">
    <div class="r1">
      <button class="back" onclick="quit()">
        <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div class="htxt">
        <h1>U3 学习关</h1>
        <p>A1 · 第 3 关 · 5 对 5</p>
      </div>
      <div class="clock" id="clock">0:00</div>
    </div>
    <div class="barwrap">
      <div class="bar"><i id="bar"></i></div>
      <div class="cnt"><b id="doneN">0</b>/<span id="totalN">20</span></div>
    </div>
  </div>

  <div class="stage">
    <div class="cols"><span>English</span><span></span><span>中文</span></div>
    <div class="board" id="board">
      <svg class="ln" id="ln" viewBox="0 0 340 500" preserveAspectRatio="none"></svg>
    </div>
  </div>

  <div class="foot">
    <div class="pick" id="pick">选一张英文卡</div>
    <div class="fb" id="fb"></div>
  </div>

  <div class="sheet" id="sheet">
    <div class="big"><span id="dRight">20</span><small>对</small></div>
    <h2>本关完成</h2>
    <p id="doneSub">用时 1 分 42 秒</p>
    <div class="rows">
      <div class="row"><span>一次选对率</span><b id="dAcc">85%</b></div>
      <div class="row"><span>最高连击</span><b id="dCombo">6</b></div>
      <div class="row"><span>平均每对用时</span><b id="dAvg">5.1 秒</b></div>
    </div>
    <div class="wr" id="dNote">3 个词配错过（date、card、horse），已在关内反复重现直到配对正确</div>
    <button class="go" id="dNext" onclick="goNext()">下一关 · U4</button>
    <button class="g2" onclick="location.reload()">回到首页</button>
  </div>
</div>

<script>
/* ================= 数据 ================= */
const WORDS = [
  {en:"address",zh:"地址",detail:"n.地址, 演讲, 称呼",ph:"[ˈædres]"},
  {en:"birthday",zh:"生日",detail:"n.生日",ph:"[ˈbɜːrθdeɪ]"},
  {en:"call",zh:"打电话",detail:"v.称呼, 打电话, 电话召唤",ph:"[kɑːl]"},
  {en:"card",zh:"卡片",detail:"n.卡片纸, 贺卡, 明信片, 名片",ph:"[kɑːrd]"},
  {en:"date",zh:"日期",detail:"n.日期, 时期, 约会",ph:"[deɪt]"},
  {en:"friend",zh:"朋友",detail:"n.朋友, 好友, 支持者",ph:"[frend]"},
  {en:"girl",zh:"女孩",detail:"n.女孩, 女儿, 年轻女子",ph:"[ɡɜːrl]"},
  {en:"hometown",zh:"家乡",detail:"n. 故乡, 家乡",ph:"[ˈhoʊmtaʊn]"},
  {en:"introduce",zh:"介绍",detail:"v.介绍, 引入, 推出",ph:"[ˌɪntrəˈduːs]"},
  {en:"name",zh:"名字",detail:"n.名字, 名声, 名人",ph:"[neɪm]"},
  {en:"number",zh:"数字",detail:"n.数字, 编号, 号码, 数量",ph:"[ˈnʌmbər]"},
  {en:"phone",zh:"电话",detail:"n.电话, 听筒",ph:"[foʊn]"},
  {en:"photo",zh:"照片",detail:"n.照片",ph:"[ˈfoʊtoʊ]"},
  {en:"cat",zh:"猫",detail:"n.猫, 猫科动物",ph:"[kæt]"},
  {en:"dog",zh:"狗",detail:"n.狗, 公狗, 赛狗",ph:"[dɑːɡ]"},
  {en:"bird",zh:"鸟",detail:"n.鸟, 怪人",ph:"[bɜːrd]"},
  {en:"fish",zh:"鱼",detail:"n.鱼, 鱼肉",ph:"[fɪʃ]"},
  {en:"horse",zh:"马",detail:"n.马, 赛马, 鞍马",ph:"[hɔːrs]"},
  {en:"bear",zh:"熊",detail:"n.熊, 忍受",ph:"[ber]"},
  {en:"butterfly",zh:"蝴蝶",detail:"n.蝴蝶",ph:"[ˈbʌtərflaɪ]"}
];
const PAIRS = 5, TOTAL = WORDS.length;

/* ================= 音效 ================= */
let AC = null;
function ac(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return AC; }
function tone(f,d,type,gain,delay){
  const c = ac(); if(!c) return;
  const t0 = c.currentTime + (delay||0);
  const o = c.createOscillator(), g = c.createGain();
  o.type = type || 'sine'; o.frequency.value = f;
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(gain || .05, t0 + .012);
  g.gain.exponentialRampToValueAtTime(.0001, t0 + d);
  o.connect(g); g.connect(c.destination); o.start(t0); o.stop(t0 + d + .02);
}
const sfx = {
  tick(){ tone(760,.045,'triangle',.022); },
  ok(){ tone(920,.09,'sine',.05); tone(1380,.13,'sine',.035,.06); },
  bad(){ tone(170,.16,'sawtooth',.04); },
  win(){ [523,659,784,1047].forEach((f,i)=>tone(f,.24,'sine',.045,i*.1)); }
};
function vib(p){ if(navigator.vibrate) try{ navigator.vibrate(p); }catch(e){} }

/* ================= 状态 ================= */
const $ = id => document.getElementById(id);
const SVGNS = 'http://www.w3.org/2000/svg';
let S = null;

function shuffle(a){ const b=a.slice(); for(let i=b.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; [b[i],b[j]]=[b[j],b[i]]; } return b; }

function brief(w){
  const d = w.detail || ''; if(!d) return '';
  const segs = [];
  for(const chunk of d.replace(/\s+([a-z]{1,8}\.)/gi, '|$1').split('|')){
    let cur = null;
    for(let p of chunk.split(/,\s*|，\s*/)){
      p = p.trim(); if(!p) continue;
      const m = p.match(/^([a-z]{1,8}\.)\s*(.*)$/i);
      if(m) cur = m[1].toLowerCase();
      segs.push({pos:cur, sense: m ? m[2] : p});
    }
  }
  const zh = (w.zh||'').trim();
  const keep = segs.filter(s => {
    if(!s.sense) return false;
    const core = s.sense.replace(/[的地得]$/,'');
    return !(zh && (zh.includes(s.sense) || core === zh));
  });
  if(!keep.length) return '';
  const picks = keep.slice(0,2);
  const same = picks.every(p => p.pos === picks[0].pos);
  let out = same ? (picks[0].pos||'') + picks.map(p=>p.sense).join('，')
                 : picks.map(p=>(p.pos||'')+p.sense).join('，');
  if(keep.length > 2) out += '…';
  return out;
}

function start(){
  S = {
    queue: shuffle(WORDS), retry: [], done: 0, total: TOTAL, combo: 0, maxCombo: 0,
    firstTry: 0, wrong: new Map(), enSlots: [], zhSlots: [],
    sel: {en:null, zh:null}, lock: false, t0: Date.now(), over: false
  };
  $('totalN').textContent = TOTAL;
  build();
  setInterval(() => {
    if(!S || S.over) return;
    const s = Math.floor((Date.now() - S.t0)/1000);
    $('clock').textContent = Math.floor(s/60) + ':' + String(s%60).padStart(2,'0');
  }, 500);
}

function blankEl(){
  const b = document.createElement('button');
  b.className = 'card blank';
  return b;
}

function build(){
  const board = $('board');
  /* 保留 SVG 层 */
  board.querySelectorAll('.card').forEach(n => n.remove());
  S.enSlots = []; S.zhSlots = [];

  /* 先按行插入占位：每行 en / zh */
  for(let i = 0; i < PAIRS; i++){
    const e = {w:null, el:blankEl()}, z = {w:null, el:blankEl()};
    S.enSlots.push(e); S.zhSlots.push(z);
    board.appendChild(e.el); board.appendChild(z.el);
  }
  const first = [];
  for(let i = 0; i < PAIRS; i++){ const w = S.queue.shift(); if(w) first.push(w); }
  shuffle(first).forEach((w,i)=>paint(S.enSlots[i], w, 'en'));
  shuffle(first).forEach((w,i)=>paint(S.zhSlots[i], w, 'zh'));
  clearLines(); hud();
}

function paint(slot, w, side){
  slot.w = w;
  const el = slot.el;
  el.className = 'card in ' + side;
  el.dataset.en = w.en;
  el.dataset.side = side;
  el.innerHTML = '';
  const m = document.createElement('span'); m.className = 'm';
  const s = document.createElement('span'); s.className = 's' + (side === 'en' ? ' ph' : '');
  m.textContent = side === 'en' ? w.en : w.zh;
  s.textContent = side === 'en' ? (w.ph || '') : brief(w);
  el.appendChild(m); if(s.textContent) el.appendChild(s);
  el.onclick = () => tap(el);
  setTimeout(()=>el.classList.remove('in'), 320);
}

function wipe(slot){
  slot.w = null;
  slot.el.className = 'card blank';
  slot.el.dataset.en = ''; slot.el.dataset.side = '';
  slot.el.innerHTML = ''; slot.el.onclick = null;
}

function nextWord(){
  const i = S.retry.findIndex(r => r.delay <= 0);
  if(i >= 0) return S.retry.splice(i,1)[0].w;
  if(S.queue.length) return S.queue.shift();
  if(S.retry.length) return S.retry.shift().w;
  return null;
}

function refill(){
  let guard = 0;
  while(guard++ < PAIRS*2){
    const ei = S.enSlots.findIndex(s => !s.w);
    const zi = S.zhSlots.findIndex(s => !s.w);
    if(ei < 0 || zi < 0) break;
    const w = nextWord(); if(!w) break;
    paint(S.enSlots[ei], w, 'en');
    paint(S.zhSlots[zi], w, 'zh');
  }
}

function hud(){
  $('bar').style.width = (S.done / S.total * 100) + '%';
  $('doneN').textContent = S.done;
}

/* ---------- 连线绘制 ---------- */
const SVG = () => $('ln');

function clearLines(){
  const svg = SVG(); if(!svg) return;
  while(svg.firstChild) svg.removeChild(svg.firstChild);
}

function anchor(el, side){
  const b = $('board').getBoundingClientRect();
  const r = el.getBoundingClientRect();
  return {
    x: (side === 'en' ? r.right : r.left) - b.left,
    y: r.top + r.height/2 - b.top
  };
}

function pathD(p1, p2){
  const dx = Math.max(30, Math.abs(p2.x - p1.x) * .45);
  return `M ${p1.x} ${p1.y} C ${p1.x + dx} ${p1.y}, ${p2.x - dx} ${p2.y}, ${p2.x} ${p2.y}`;
}

function drawPair(p1, p2, color, w){
  const svg = SVG();
  const path = document.createElementNS(SVGNS, 'path');
  path.setAttribute('d', pathD(p1, p2));
  path.setAttribute('fill', 'none');
  path.setAttribute('stroke', color);
  path.setAttribute('stroke-width', w || 2.4);
  path.setAttribute('stroke-linecap', 'round');
  path.setAttribute('opacity', '0');
  svg.appendChild(path);
  const len = path.getTotalLength ? path.getTotalLength() : 400;
  path.style.strokeDasharray = len;
  path.style.strokeDashoffset = len;
  path.style.transition = 'stroke-dashoffset .26s ease, opacity .16s';
  requestAnimationFrame(() => {
    path.setAttribute('opacity', '1');
    path.style.strokeDashoffset = '0';
  });
  [p1, p2].forEach(p => {
    const c = document.createElementNS(SVGNS, 'circle');
    c.setAttribute('cx', p.x); c.setAttribute('cy', p.y); c.setAttribute('r', 3.6);
    c.setAttribute('fill', color); c.setAttribute('opacity', '0');
    svg.appendChild(c);
    requestAnimationFrame(() => c.setAttribute('opacity', '1'));
  });
  return path;
}

/* 选中一侧后，从卡片指向中缝的提示线 */
function hintLine(el, side){
  clearLines();
  const p = anchor(el, side);
  const b = $('board').getBoundingClientRect();
  const mid = side === 'en' ? p.x + 26 : p.x - 26;
  const svg = SVG();
  const path = document.createElementNS(SVGNS, 'path');
  path.setAttribute('d', `M ${p.x} ${p.y} L ${mid} ${p.y}`);
  path.setAttribute('stroke', '#B9B2F5');
  path.setAttribute('stroke-width', 2);
  path.setAttribute('stroke-linecap', 'round');
  path.setAttribute('stroke-dasharray', '2 5');
  path.setAttribute('fill', 'none');
  svg.appendChild(path);
  const c = document.createElementNS(SVGNS, 'circle');
  c.setAttribute('cx', p.x); c.setAttribute('cy', p.y); c.setAttribute('r', 4);
  c.setAttribute('fill', '#5A50E0');
  svg.appendChild(c);
}

/* ---------- 交互 ---------- */
function tap(el){
  if(!S || S.lock || !el.dataset.en) return;
  const side = el.dataset.side;
  if(S.sel[side] === el){
    el.classList.remove('sel'); S.sel[side] = null; clearLines();
    $('pick').textContent = '选一张英文卡'; $('fb').textContent = '';
    return;
  }
  if(S.sel[side]) S.sel[side].classList.remove('sel');
  S.sel[side] = el; el.classList.add('sel');
  sfx.tick();
  $('fb').className = 'fb'; $('fb').textContent = '';
  const w = (side === 'en' ? S.enSlots : S.zhSlots).find(s => s.el === el).w;
  $('pick').innerHTML = side === 'en'
    ? '已选 <em>' + (w ? w.en : '') + '</em> · 点右侧任意中文'
    : '已选 <span class="w">' + (w ? w.zh : '') + '</span> · 点左侧英文';
  if(S.sel.en && S.sel.zh){ clearLines(); judge(); }
  else hintLine(el, side);
}

function judge(){
  S.lock = true;
  const enEl = S.sel.en, zhEl = S.sel.zh;
  const enSlot = S.enSlots.find(s => s.el === enEl);
  const zhSlot = S.zhSlots.find(s => s.el === zhEl);
  const w1 = enSlot.w, w2 = zhSlot.w;
  const ok = !!w1 && !!w2 && w1.en === w2.en;

  const p1 = anchor(enEl, 'en'), p2 = anchor(zhEl, 'zh');
  const path = drawPair(p1, p2, ok ? '#12A06A' : '#E24B4A', 2.6);

  setTimeout(() => {
    if(ok){
      S.done++; S.combo++; S.maxCombo = Math.max(S.maxCombo, S.combo);
      if(!S.wrong.has(w1.en)) S.firstTry++;
      enEl.classList.add('ok'); zhEl.classList.add('ok');
      sfx.ok(); vib(24);
      $('fb').className = 'fb ok';
      $('fb').textContent = (S.combo >= 2 ? '连对 ' + S.combo + ' · ' : '✓ ') + w1.en + ' = ' + w1.zh;
      S.retry.forEach(r => r.delay--);
      setTimeout(() => {
        enEl.classList.add('out'); zhEl.classList.add('out');
        path.style.opacity = '0';
        setTimeout(() => {
          clearLines();
          wipe(enSlot); wipe(zhSlot); refill(); hud();
          S.sel = {en:null, zh:null}; S.lock = false;
          $('pick').textContent = '选一张英文卡';
          checkEnd();
        }, 240);
      }, 380);
    } else {
      S.combo = 0;
      [w1,w2].forEach(w => w && S.wrong.set(w.en, (S.wrong.get(w.en)||0)+1));
      enEl.classList.add('bad'); zhEl.classList.add('bad');
      sfx.bad(); vib([50,40,50]);
      $('fb').className = 'fb bad'; $('fb').textContent = '配错了 · 稍后这两个词会再出现';
      setTimeout(() => {
        clearLines();
        [w1,w2].forEach(w => {
          if(!w) return;
          const es = S.enSlots.find(s => s.w === w); if(es) wipe(es);
          const zs = S.zhSlots.find(s => s.w === w); if(zs) wipe(zs);
        });
        if(w1) S.retry.push({w:w1, delay:2});
        if(w2) S.retry.push({w:w2, delay:2});
        refill(); hud();
        S.sel = {en:null, zh:null}; S.lock = false;
        $('pick').textContent = '选一张英文卡';
        checkEnd();
      }, 720);
    }
  }, 300);
}

function checkEnd(){
  const empty = S.enSlots.every(s => !s.w) && S.zhSlots.every(s => !s.w);
  if(empty && !S.queue.length && !S.retry.length) setTimeout(finish, 480);
}

function finish(){
  if(!S || S.over) return;
  S.over = true;
  const sec = Math.floor((Date.now() - S.t0)/1000);
  $('dRight').textContent = S.total;
  $('dAcc').textContent = Math.round(S.firstTry/S.total*100) + '%';
  $('dCombo').textContent = S.maxCombo;
  $('dAvg').textContent = (sec / S.total).toFixed(1) + ' 秒';
  $('doneSub').textContent = '用时 ' + (sec >= 60 ? Math.floor(sec/60)+' 分 '+(sec%60)+' 秒' : sec+' 秒') + ' · U3 学习关';
  const wr = [...S.wrong.keys()];
  $('dNote').textContent = wr.length
    ? wr.length + ' 个词配错过（' + wr.slice(0,6).join('、') + (wr.length>6?'…':'') + '），已在关内反复重现直到配对正确'
    : '一次全对，本关没有返工';
  $('sheet').classList.add('show');
  sfx.win(); vib([40,60,40,60,120]);
}

function quit(){ if(S) S.over = true; location.reload(); }
function goNext(){ $('sheet').classList.remove('show'); start(); }

/* ================= 演示态 ================= */
function midState(){
  start();
  setTimeout(() => {
    S.t0 = Date.now() - 74000;
    S.done = 12; S.combo = 2; S.maxCombo = 2;
    S.queue = shuffle(WORDS).slice(0, 8);
    S.enSlots.forEach(s => wipe(s)); S.zhSlots.forEach(s => wipe(s));
    refill(); hud();
    const t = S.enSlots.find(s => s.w);
    if(t){
      t.el.classList.add('sel'); S.sel.en = t.el;
      $('pick').innerHTML = '已选 <em>' + t.w.en + '</em> · 点右侧任意中文';
      hintLine(t.el, 'en');
    }
  }, 140);
}

if(location.hash === '#done'){
  start();
  setTimeout(() => {
    S.done = S.total; S.firstTry = S.total - 3; S.maxCombo = 6;
    S.wrong = new Map([['date',2],['card',1],['horse',1]]);
    S.t0 = Date.now() - 102000;
    S.enSlots.forEach(s => wipe(s)); S.zhSlots.forEach(s => wipe(s));
    S.queue = []; S.retry = [];
    hud(); finish();
  }, 120);
} else if(location.hash === '#mid'){
  midState();
} else {
  start();
}
</script>
